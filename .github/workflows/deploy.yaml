name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: vuln-app-cluster
  GKE_ZONE: us-central1-a
  IMAGE: vuln-app-image
  GAR_ZONE: us-central1
  GAR_REPO: vuln-app-repo

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # Setup gcloud CLI
    - uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    # Configure Docker to use the gcloud command-line tool as a credential
    # helper for authentication
    - run: |-
        gcloud --quiet auth configure-docker ${env.GAR_ZONE}-docker.pkg.dev

    # Build the Docker image
    - name: Build
      run: |-
        docker build \
          --tag "${env.GAR_ZONE}-docker.pkg.dev/${env.PROJECT_ID}/${env.GAR_REPO}/${env.IMAGE}:$GITHUB_SHA" \
          ./app

    # Push the Docker image to Google Artifact Registry
    - name: Publish
      run: |-
        docker push "${env.GAR_ZONE}-docker.pkg.dev/${env.PROJECT_ID}/${env.GAR_REPO}/${env.IMAGE}:$GITHUB_SHA"

    # Get the GKE credentials so we can deploy to the cluster
    - uses: google-github-actions/get-gke-credentials@v1
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_ZONE }}

    # Deploy to the GKE cluster
    - name: Deploy
      run: |-
        kubectl create deployment vuln-app --image="${env.GAR_ZONE}-docker.pkg.dev/${env.PROJECT_ID}/${env.GAR_REPO}/${env.IMAGE}:$GITHUB_SHA" --dry-run=client -o yaml | kubectl apply -f -
        kubectl expose deployment vuln-app --type=LoadBalancer --port 80 --target-port 8080 --dry-run=client -o yaml | kubectl apply -f -
        kubectl rollout status deployment/vuln-app

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSRF Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>SSRF (Cloud Function)</h1>
        <p>This page calls a Cloud Function that fetches a URL. Try to access the Metadata Server!</p>
        <p>Target: <code>http://metadata.google.internal/computeMetadata/v1/</code> (Header:
            <code>Metadata-Flavor: Google</code>)</p>

        <form id="ssrfForm">
            <div class="form-group">
                <label for="url">URL to Fetch:</label>
                <input type="text" id="url" name="url" value="https://www.google.com" required>
            </div>
            <button type="submit">Fetch URL</button>
        </form>

        <div id="result" class="result" style="white-space: pre-wrap;"></div>

        <a href="/">Back to Home</a>
    </div>
    <script>
        let functionUrl = '';

        // Get the Cloud Function URL from backend config
        fetch('/api/config')
            .then(res => res.json())
            .then(data => {
                functionUrl = data.ssrfFunctionUrl;
                if (!functionUrl) {
                    document.getElementById('result').textContent = "Error: Cloud Function URL not configured.";
                }
            });

        document.getElementById('ssrfForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!functionUrl) return;

            const targetUrl = document.getElementById('url').value;
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = "Fetching...";

            try {
                // Call the Cloud Function directly (assuming it has CORS enabled or we proxy)
                // The Cloud Function expects ?url=...
                const response = await fetch(`${functionUrl}?url=${encodeURIComponent(targetUrl)}`);
                const text = await response.text();
                resultDiv.textContent = text;
            } catch (err) {
                resultDiv.textContent = "Error: " + err.message;
            }
        });
    </script>
</body>

</html>
